[package]
name = "pyshell"
version = "0.5.0"
description = "GUI for running Python scripts with isolated venvs"
authors = ["Dmytro Lobov"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/mono-ninja/PyShell"

[lib]
name = "pyshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
ts-rs = { version = "10", features = ["chrono-impl", "no-serde-warnings", "serde-json-impl"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = "3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
glob = "0.3"
which = "7"
dirs = "5"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
notify = "7"
# Same version and TLS stack the updater plugin already compiles in, so this
# adds no second copy of reqwest to the build. Used only by `repo.rs` (the
# Script Store); rustls avoids an OpenSSL dependency on every target.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
objc = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    # CreateJobObjectW takes a SECURITY_ATTRIBUTES pointer, so it is gated behind
    # this feature — without it the Windows build does not compile.
    "Win32_Security",
] }

[dev-dependencies]
insta = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
